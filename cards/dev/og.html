<!doctype html>
<html><head><meta charset="UTF-8" /><link rel="stylesheet" href="/site.css" />
<style>
  body { width: 1200px; height: 630px; overflow: hidden; margin: 0; }
  .og { width: 1200px; height: 630px; display: grid; grid-template-columns: 560px 1fr; align-items: center; padding-left: 64px; }
  .brand { font-size: 28px; gap: 12px; } .brand svg { width: 42px; height: 42px; } .brand small { color: #ffc857; font-size: 18px; letter-spacing: .06em; margin-left: 6px; }
  h1 { font-size: 64px; line-height: 1.02; margin: 26px 0 20px; letter-spacing: -0.02em; } h1 span { color: #ff8fb8; }
  p { color: var(--muted); font-size: 25px; line-height: 1.4; margin: 0 0 28px; }
  .url { color: var(--text); font-weight: 700; font-size: 23px; padding: 10px 18px; border: 1px solid var(--line-2); border-radius: 12px; display: inline-block; background: var(--bg-2); }
  .phones { position: relative; height: 630px; }
  .phones img { position: absolute; width: 200px; height: 356px; object-fit: cover; border-radius: 22px; border: 2px solid rgba(255,255,255,.16); box-shadow: 0 30px 70px rgba(0,0,0,.6); }
  .phones img:nth-child(1) { left: 0; top: 150px; transform: rotate(-7deg); }
  .phones img:nth-child(2) { left: 180px; top: 105px; z-index: 2; }
  .phones img:nth-child(3) { left: 360px; top: 160px; transform: rotate(7deg); }
</style></head>
<body><div class="og"><div>
  <a class="brand"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="12.5" fill="none" stroke="#eef0ff" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="66 12.5" transform="rotate(-62 16 16)"/><circle cx="12.2" cy="19.6" r="4.3" fill="#ffc857"/></svg><span>Melody Bounce<small>CARDS</small></span></a>
  <h1>A card that <span>sings their name</span></h1>
  <p>A little ball bounces along the lyrics and lands on their name. Free, in a minute.</p>
  <span class="url">card.melodybounce.com</span>
</div><div class="phones"><img src="/dev/hero-congrats.png"><img src="/dev/hero-birthday.png"><img src="/dev/hero-christmas.png"></div></div></body></html>

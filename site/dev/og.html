<!doctype html>
<html><head><meta charset="UTF-8" /><link rel="stylesheet" href="/site.css" />
<style>
  body { width: 1200px; height: 630px; overflow: hidden; margin: 0; }
  .og { position: relative; width: 1200px; height: 630px; display: grid; grid-template-columns: 548px 1fr; align-items: center; padding: 0 0 0 64px; }
  .og .brand { font-size: 30px; gap: 14px; }
  .og .brand svg { width: 44px; height: 44px; }
  .og h1 { font-size: 66px; line-height: 1.02; margin: 28px 0 22px; letter-spacing: -0.02em; }
  .og h1 span { color: var(--amber); }
  .og p { color: var(--muted); font-size: 25px; line-height: 1.4; margin: 0 0 30px; }
  .og .url { color: var(--text); font-weight: 700; font-size: 24px; padding: 10px 18px; border: 1px solid var(--line-2); border-radius: 12px; display: inline-block; background: var(--bg-2); }
  .phones { position: relative; height: 630px; }
  .phones img { position: absolute; width: 210px; height: 373px; object-fit: cover; border-radius: 22px; border: 2px solid rgba(255,255,255,0.16); box-shadow: 0 30px 70px rgba(0,0,0,0.6); }
  .phones img:nth-child(1) { left: 0px; top: 150px; transform: rotate(-7deg); }
  .phones img:nth-child(2) { left: 185px; top: 100px; z-index: 2; transform: rotate(1deg); }
  .phones img:nth-child(3) { left: 368px; top: 160px; transform: rotate(8deg); }
</style></head>
<body><div class="og">
  <div>
    <a class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12.5" fill="none" stroke="#eef0ff" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="66 12.5" transform="rotate(-62 16 16)"/><circle cx="12.2" cy="19.6" r="4.3" fill="#ffc857"/></svg><span>Melody Bounce</span></a>
    <h1>Every bounce plays <span>the next note</span></h1>
    <p>Make bouncing-ball music videos in your browser. Nine physics scenes, any melody, free MP4 export.</p>
    <span class="url">melodybounce.com</span>
  </div>
  <div class="phones"><img src="/posters/rings.webp" alt=""><img src="/posters/hexagon.webp" alt=""><img src="/posters/colorwar.webp" alt=""></div>
</div></body></html>
